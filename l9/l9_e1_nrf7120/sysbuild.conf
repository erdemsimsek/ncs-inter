# STEP 1.1 - Enable MCUboot 
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# STEP 1.2 - Configure bootloader mode for dual-slot DFU
# SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y  # Single slot (no DFU from app)
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=n    # Dual slot (enables DFU from app)

# MCUboot padding partition size (match signing requirement)
SB_CONFIG_PM_MCUBOOT_PAD=0x800