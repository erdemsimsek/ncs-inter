# STEP 2.3 - Enable logging for MCUboot
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_BOOT_BANNER=y

# STEP 3.1 - Enable Serial Recovery over UART
# Temporarily disabled for debugging - serial recovery and console conflict in MCUboot
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# STEP 3.2 - Enable UART console for debugging
CONFIG_UART_CONSOLE=n

# STEP 3.3 - Turn on a LED so we can see when Serial Recovery mode is active
CONFIG_MCUBOOT_INDICATION_LED=n

# for nrf54l15
# CONFIG_PM_PARTITION_SIZE_MCUBOOT=0xF000
# for nrf7120
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000
CONFIG_PM_PARTITION_SIZE_MCUBOOT_PAD=0x800

# Increase max image sectors to handle large slot size
# Application slot is ~1950KB = ~488 sectors (at 4KB/sector)
# Set to 512 to provide some headroom
CONFIG_BOOT_MAX_IMG_SECTORS=512

# Disable flash protection for bootloader area
CONFIG_FPROTECT=n

# GPIO entry disabled while serial recovery is disabled
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000